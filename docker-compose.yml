services:
  customs-app:
    build: .
    ports:
      - 8080:8080
    depends_on:
      - db
      - redis
      - minio
    networks:
        - cloud-net


  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=QVlBTkFNSVJBWUlTUEFTU1dPUkRGT1JQT1NUR1JFU0RC
      - POSTGRES_DB=sweez_customs_digital
    networks:
      - cloud-net


  redis:
    image: redis:7-alpine
    container_name: customs_redis
    ports:
      - 6379:6379
    restart: always
    networks:
      - cloud-net


  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=QVlBTkFNSVJBWUlTUEFTU1dPUkRGT1JNSU5JTw==
    volumes:
      - minio-data:/data
    command:
      - server
      - --console-address
      - ":9001"
      - /data
    networks:
      - cloud-net




networks:
  cloud-net:
    external: true