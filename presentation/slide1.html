<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1280px; height:720px; overflow:hidden;
  font-family:'Segoe UI',Arial,sans-serif;
  background:#1a1a2e;
  position:relative;
}

/* Яркий диагональный фон */
.bg-main {
  position:absolute; inset:0;
  background: linear-gradient(135deg, #0f3460 0%, #16213e 40%, #1a1a2e 100%);
}

/* Большой цветной блок справа */
.bg-right {
  position:absolute;
  right:0; top:0; bottom:0; width:520px;
  background: linear-gradient(160deg, #e94560 0%, #f5a623 50%, #f7c59f 100%);
  clip-path: polygon(18% 0%, 100% 0%, 100% 100%, 0% 100%);
}

/* Декоративные круги */
.circle1 {
  position:absolute; width:380px; height:380px; border-radius:50%;
  background: rgba(233,69,96,0.15);
  top:-80px; right:80px;
}
.circle2 {
  position:absolute; width:200px; height:200px; border-radius:50%;
  background: rgba(245,166,35,0.2);
  bottom:60px; right:300px;
}

/* Контент */
.content {
  position:absolute; z-index:10;
  left:70px; top:0; bottom:0;
  display:flex; flex-direction:column; justify-content:center;
  width:680px;
}

.eyebrow {
  font-size:13px; font-weight:700; letter-spacing:4px;
  color:#f5a623; text-transform:uppercase;
  margin-bottom:18px;
  display:flex; align-items:center; gap:10px;
}
.eyebrow::before {
  content:''; display:block;
  width:32px; height:3px;
  background:#f5a623; border-radius:2px;
}

h1 {
  font-size:68px; font-weight:900; line-height:1.0;
  color:#ffffff; margin-bottom:10px;
  letter-spacing:-2px;
}
h1 .accent { color:#f5a623; }

.tagline {
  font-size:20px; font-weight:400; color:rgba(255,255,255,0.65);
  margin-bottom:48px; line-height:1.5;
}

/* Статистика */
.stats { display:flex; gap:0; }
.stat-box {
  padding:18px 28px;
  border-left:3px solid rgba(255,255,255,0.1);
}
.stat-box:first-child { border-left:none; padding-left:0; }
.stat-num {
  font-size:40px; font-weight:900; color:#f5a623;
  line-height:1;
}
.stat-label {
  font-size:12px; color:rgba(255,255,255,0.5);
  text-transform:uppercase; letter-spacing:1px;
  margin-top:4px;
}

/* Правый контент поверх цветного блока */
.right-content {
  position:absolute; z-index:10;
  right:50px; top:50%; transform:translateY(-50%);
  text-align:center;
}
.big-icon {
  font-size:110px; line-height:1;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,0.3));
  margin-bottom:16px;
}
.right-title {
  font-size:22px; font-weight:800; color:#1a1a2e;
  margin-bottom:6px;
}
.right-sub { font-size:14px; color:rgba(26,26,46,0.65); }

/* Нижняя полоса */
.bottom-bar {
  position:absolute; bottom:0; left:0; right:0; height:6px;
  background: linear-gradient(90deg, #e94560, #f5a623, #4ecdc4, #45b7d1);
}
</style>
</head>
<body>
<div class="bg-main"></div>
<div class="bg-right"></div>
<div class="circle1"></div>
<div class="circle2"></div>

<div class="content">
  <div class="eyebrow">Цифровая таможня Кыргызстана</div>
  <h1>Sweez<br><span class="accent">Customs</span></h1>
  <div class="tagline">Умная система таможенного<br>оформления — онлайн, быстро, точно</div>
  <div class="stats">
    <div class="stat-box">
      <div class="stat-num">3</div>
      <div class="stat-label">Типа деклараций</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">8</div>
      <div class="stat-label">Ролей в системе</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">3</div>
      <div class="stat-label">Языка</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">0</div>
      <div class="stat-label">Бумажных форм</div>
    </div>
  </div>
</div>

<div class="right-content">
  <div class="big-icon">🛃</div>
  <div class="right-title">Кыргызская Республика</div>
  <div class="right-sub">2025 год</div>
</div>

<div class="bottom-bar"></div>
</body>
</html>
