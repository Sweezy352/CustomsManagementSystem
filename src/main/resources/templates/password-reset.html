<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; font-family: 'Inter', -apple-system, sans-serif; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #0f172a; padding: 40px 0; }
        .main-card { max-width: 480px; margin: 0 auto; background-color: #1e293b; border-radius: 24px; border: 1px solid #334155; padding: 40px; text-align: center; }
        .logo { font-size: 24px; font-weight: 800; color: #38bdf8; margin-bottom: 32px; letter-spacing: -1px; }
        .title { color: #f8fafc; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        .text { color: #94a3b8; font-size: 15px; line-height: 24px; margin-bottom: 32px; }

        /* Стили для кода подтверждения */
        .code-container {
            background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
            padding: 2px; /* Эффект свечения рамки */
            border-radius: 16px;
            display: inline-block;
            margin: 0 auto 32px auto;
        }
        .code-inner {
            background-color: #1e293b;
            padding: 20px 40px;
            border-radius: 14px;
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
        }

        .footer { margin-top: 32px; color: #64748b; font-size: 13px; border-top: 1px solid #334155; padding-top: 24px; }
        .expiry { color: #fb7185; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="main-card">
        <div class="logo">SWEEZ CUSTOMS</div>

        <h1 class="title" th:text="#{mail.reset.title}">Восстановление доступа</h1>
        <p class="text" th:text="#{mail.reset.message}">Используйте проверочный код ниже, чтобы завершить смену пароля.</p>

        <div class="code-container">
            <div class="code-inner" th:text="${code}">123456</div>
        </div>

        <p class="expiry" th:text="#{mail.reset.expire}">Код истечет через 15 минут</p>

        <div class="footer">
            <p th:text="#{mail.footer.ignore}">Если вы не запрашивали код, просто удалите это письмо.</p>
            <p>© 2026 Sweez Logistics Solutions</p>
        </div>
    </div>
</div>
</body>
</html>
