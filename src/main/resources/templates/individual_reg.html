<!DOCTYPE html>
<html>
<head>
    <title>Sweez Signature Pad</title>
    <style>
        #signature-pad {
            border: 2px dashed #ccc;
            border-radius: 8px;
            cursor: crosshair;
            background-color: #f9f9f9;
        }
        .controls { margin-top: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
<h3>Поставьте вашу подпись:</h3>
<canvas id="signature-pad" width="400" height="200"></canvas>

<div class="controls">
    <button id="clear">Очистить</button>
    <button id="save">Сгенерировать строку для бэкенда</button>
</div>

<h4>Результат (Base64), который уйдет в контроллер:</h4>
<textarea id="result" style="width: 100%; height: 100px;" readonly></textarea>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script>
    const canvas = document.querySelector("canvas");
    const signaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgba(255, 255, 255, 0)', // Прозрачный фон
        penColor: 'rgb(0, 0, 0)' // Черные чернила
    });

    document.getElementById('clear').addEventListener('click', () => {
        signaturePad.clear();
        document.getElementById('result').value = '';
    });

    document.getElementById('save').addEventListener('click', () => {
        if (signaturePad.isEmpty()) {
            alert("Пожалуйста, распишитесь сначала!");
        } else {
            // Получаем данные в формате PNG Base64
            const dataURL = signaturePad.toDataURL("image/png");
            document.getElementById('result').value = dataURL;
            console.log("Отправляем на бэкенд:", dataURL);
        }
    });
</script>
</body>
</html>
